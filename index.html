<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Track</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <i class="fa-solid fa-briefcase"></i>
        <div class="app-title">
          <h2>JobTrack</h2>
          <p>
            <span>Track</span> <i class="fa-solid fa-circle"></i>
            <span>Organize</span> <i class="fa-solid fa-circle"></i>
            <span>Get Hired</span>
          </p>
        </div>
      </header>
      <section class="search-n-profile">
        <form class="search">
          <input
            type="text"
            class="search-field"
            placeholder="Search companies, job titles, or keywords..."
          />
          <button class="btn search-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
          </button>
        </form>
        <div class="profile-container">
          <button class="notification-btn">
            <!-- <i class="fa-regular fa-bell"></i> -->
            <i class="fa-solid fa-bell"></i>
            <span class="badge">3</span>
          </button>
          <button class="profile-container">
            <i class="fa-solid fa-user"></i>
            <span class="profile-name">Rocktotpal</span>
            <span class="drop-down"> &#x2304; </span>
          </button>
        </div>
      </section>
      <nav class="nav-container">
        <ul class="nav-items">
          <li class="nav-item">
            <i class="fa-solid fa-house"></i>
            <p>Dashboard</p>
          </li>

          <li class="nav-item">
            <i class="fa-regular fa-file-lines"></i>
            <p>Applications</p>
          </li>

          <li class="nav-item">
            <i class="fa-regular fa-bookmark"></i>
            <p>Saved Jobs</p>
          </li>

          <li class="nav-item">
            <i class="fa-solid fa-building"></i>
            <p>Companies</p>
          </li>

          <li class="nav-item">
            <i class="fa-regular fa-calendar-days"></i>
            <p>Calender</p>
          </li>

          <li class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <p>Settings</p>
          </li>
        </ul>

        <div class="motivation-card">
          <div class="card-icon">
            <!-- <svg
              xmlns="http://w3.org"
              viewBox="0 0 24 24"
              width="24"
              height="24"
            >
              <path
                fill="#0066cc"
                d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2zm-1 15l-5-5 1.41-1.41L11 14.17l7.59-7.59L20 8l-9 9z"
              />
            </svg> -->
            <i class="fa-solid fa-seedling"></i>
          </div>

          <p class="card-text">
            Small steps <br />every day lead to <br />big results
          </p>

          <div class="card-decoration">
            <svg viewBox="0 0 100 20" width="80" height="20">
              <path
                d="M5,15 Q30,5 50,15 T95,10"
                fill="transparent"
                stroke="#0066cc"
                stroke-width="2"
              />
            </svg>
          </div>
        </div>
      </nav>
      <main class="hero-container">
        <section class="application-container">
          <header class="application-title">
            <div class="title-description">
              <h1>My Job Application</h1>
              <p>
                Keep track of your applications, interviews and offers all in
                one place
              </p>
            </div>
            <button class="add-application">
              <i class="fa-solid fa-plus"></i>
              <span class="add-text">Add Application</span>
            </button>
          </header>
        </section>
        <section class="feature-container"></section>
      </main>
    </div>
  </body>
</html>
